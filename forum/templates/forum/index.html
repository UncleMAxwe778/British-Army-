{% extends 'base.html' %}

{% block content %}
<style>
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
    }

    /* Make sure the wrapper stretches full width */
    .full-screen-bg {
        position: fixed;       /* stay in place even if content scrolls */
        top: 0;
        left: 0;
        width: 100vw;          /* full viewport width */
        height: 100vh;         /* full viewport height */
        background-color: #0f2742;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        z-index: -1;           /* keep behind navbar/content */
        flex-direction: column;
    }

    .welcome-box img {
        width: 140px;
        margin-bottom: 20px;
    }

    .welcome-title {
        font-size: 2.5rem;
        font-weight: 600;
        letter-spacing: 1px;
    }
</style>

<div class="full-screen-bg">
    <div class="welcome-box">
        <img src="https://flagcdn.com/gb.svg" alt="UK Flag">
        <h1 class="welcome-title">Welcome to British Army Mr. {{ user.first_name }} {{ user.last_name }}</h1>
    </div>
</div>
{% endblock %}
