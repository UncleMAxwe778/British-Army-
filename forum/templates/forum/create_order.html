{% extends 'base.html' %}
{% load crispy_forms_tags %}


{% block content %}
<div class="container w-50">
    <h2>Create the order</h2>
    <form method="post" action="{% url 'forum:make_order_for_soldier' %}">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary">Create</button>
    </form>
</div>
{% endblock %}
